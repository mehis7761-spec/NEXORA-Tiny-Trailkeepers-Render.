name: NEXORA free render smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render.yml'
jobs:
  render-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 150s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo timeout 150s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y -qq ffmpeg
      - name: Verify FFmpeg available
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Generate synthetic 3-second video
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=24:duration=3" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/nexora-smoke.mp4
      - name: Validate output and decode
        run: |
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/nexora-smoke.mp4
          ffmpeg -v error -xerror -i /tmp/nexora-smoke.mp4 -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nexora-smoke.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nexora-smoke.mp4)" = "aac"
