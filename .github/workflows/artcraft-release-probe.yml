name: NEXORA ArtCraft Linux pinned release probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/artcraft-release-probe.yml'
permissions:
  contents: read
jobs:
  release-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: filmcraft
            version: 0.13.0
            expected_sha256: 40e9d685fb3ed1b0a21c9c02211f1a8499e09a47c551244ce7ee80f2584d3a9b
          - app: effectcraft
            version: 0.17.0
            expected_sha256: cd7ace0d74734b79e851f18537c14b2953b7feb5da240f5005e6805476a15292
    steps:
      - name: Inspect runner
        run: |
          uname -a
          cat /etc/os-release | head -5
          df -h .
          command -v curl sha256sum tar timeout file
      - name: Download and verify pinned official release
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          ver="${{ matrix.version }}"
          archive="${app}-${ver}-linux-x86_64.tar.gz"
          url="https://github.com/storytold/${app}/releases/download/v${ver}/${archive}"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 "$url" --output "$archive"
          echo "${{ matrix.expected_sha256 }}  ${archive}" | sha256sum --check --status
          echo "SHA256 PASS: $archive"
          mkdir -p unpack
          tar -tzf "$archive" | head -40 || true
          tar -xzf "$archive" -C unpack
          echo "Executable candidates:"
          find unpack -maxdepth 5 -type f \( -name '*craft*' -o -name '*cli*' \) | head -70
      - name: Probe installed executable and CLI
        shell: bash
        run: |
          set +e
          set -uo pipefail
          app="${{ matrix.app }}"
          count=0
          while IFS= read -r -d '' executable; do
            count=$((count+1))
            chmod u+x "$executable"
            echo "=== $executable ==="
            file "$executable"
            timeout 15s "$executable" --help > /tmp/craft-help.log 2>&1
            rc=$?
            echo "exit_code=$rc"
            head -c 3500 /tmp/craft-help.log || true
            echo
          done < <(find unpack -type f -name "${app}-cli" -print0)
          echo "candidate_count=$count"
          if [ "$count" -eq 0 ]; then
            echo "NO_CLI_FOUND: inspect package layout or install.sh; no import/export attempted"
          fi
      - name: Install free FFmpeg for media probe and decode checks
        run: |
          set -euo pipefail
          # The Ubuntu runner already has package indexes. A full apt update
          # timed out (exit 124) on the FilmCraft matrix job on 2026-10-26.
          # Prefer the runner's preinstalled FFmpeg, then cached indexes.
          if command -v ffmpeg && command -v ffprobe; then
            echo "FFmpeg already installed; no network/package operation"
          elif sudo timeout 120s apt-get -o DPkg::Lock::Timeout=20 -o Acquire::Retries=1 install -y -qq ffmpeg; then
            echo "FFmpeg installed from available package indexes"
          else
            echo "Direct install failed; refresh indexes with bounded timeouts"
            sudo timeout 100s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update -qq
            sudo timeout 120s apt-get -o DPkg::Lock::Timeout=20 -o Acquire::Retries=1 install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
      - name: Native CLI mini smoke (demo only, not original 12s)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native
          app="${{ matrix.app }}"
          cli="$(find unpack -type f -name "${app}-cli" -print -quit)"
          test -n "$cli"
          chmod +x "$cli"
          if [ "$app" = "filmcraft" ]; then
            ffmpeg -hide_banner -loglevel error -nostdin -y -f lavfi -i "testsrc2=size=320x180:rate=12:duration=2" -f lavfi -i "sine=frequency=440:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest native/synthetic_input.mp4
            timeout 45s "$cli" probe native/synthetic_input.mp4 | head -c 1500
            echo
            timeout 60s "$cli" --demo --save-as native/filmcraft_test.fcproj import native/synthetic_input.mp4 || { echo "IMPORT_FAILED: inspect CLI behavior"; exit 1; }
            timeout 180s "$cli" --demo export native/filmcraft_demo.mp4 --format h264 --start 0 --end 1 --no-audio >native/native.log 2>&1 || { cat native/native.log; echo "FILMCRAFT_DEMO_EXPORT_FAILED"; exit 1; }
            target=native/filmcraft_demo.mp4
          else
            timeout 180s "$cli" --demo render --out native/effectcraft_demo.mp4 --end 1 --audio off >native/native.log 2>&1 || { cat native/native.log; echo "EFFECTCRAFT_DEMO_RENDER_FAILED"; exit 1; }
            target=native/effectcraft_demo.mp4
          fi
          test -s "$target"
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json "$target"
          ffmpeg -v error -i "$target" -f null -
          sha256sum "$target"
          echo "NATIVE_DEMO_MP4_DECODE_PASS (NOT original video; audio may be absent)"
      - name: Report exact verification gate
        if: always()
        run: |
          echo "ArtCraft integration gate remains CLOSED."
          echo "Check each job step to determine whether the native demo and decode passed."
          echo "No 12-second original source imported; no editor-native effect or MP4 export verified."
          echo "No paid runners, caches, or artifacts used."
