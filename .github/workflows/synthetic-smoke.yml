name: NEXORA free render infrastructure smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect available tools
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Generate and effect-test synthetic sample
        run: |
          set -euo pipefail
          mkdir -p output
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1920x1080:rate=16:duration=2" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=2" -vf "eq=contrast=1.06:saturation=1.12,vignette=PI/5" -c:v libx264 -preset ultrafast -threads 2 -pix_fmt yuv420p -c:a aac -shortest output/synthetic_smoke.mp4
          ffmpeg -v error -i output/synthetic_smoke.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json output/synthetic_smoke.mp4 | tee output/metadata.json
          python3 - <<'PY'
          import json
          d=json.load(open('output/metadata.json'))
          assert abs(float(d['format']['duration'])-2)<0.2
          assert any(s.get('width')==1920 and s.get('height')==1080 for s in d['streams'])
          assert any(s.get('codec_type')=='audio' for s in d['streams'])
          print('PASS: duration, resolution, audio and decode')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke
          path: output/
          retention-days: 1
