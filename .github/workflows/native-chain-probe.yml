name: NEXORA native FilmCraft to EffectCraft chain (synthetic)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-chain-probe.yml'
      - 'assets/original_12s.mp4'
permissions:
  contents: read
jobs:
  native-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free FFmpeg and fetch pinned ArtCraft releases
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg || ! command -v ffprobe; then
            echo "FFmpeg missing; bounded apt install with visible logs"
            if ! sudo timeout 65s apt-get -o DPkg::Lock::Timeout=10 -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y ffmpeg; then
              echo "First apt install failed/timed out; refresh indexes once with bounded timeouts"
              sudo timeout 70s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
              sudo timeout 80s apt-get -o DPkg::Lock::Timeout=10 -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y ffmpeg
            fi
          fi
          command -v ffmpeg && command -v ffprobe
          mkdir -p native bin
          for spec in 'filmcraft 0.13.0 40e9d685fb3ed1b0a21c9c02211f1a8499e09a47c551244ce7ee80f2584d3a9b' 'effectcraft 0.17.0 cd7ace0d74734b79e851f18537c14b2953b7feb5da240f5005e6805476a15292'; do
            read -r app version checksum <<< "$spec"
            archive="${app}-${version}-linux-x86_64.tar.gz"
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 "https://github.com/storytold/${app}/releases/download/v${version}/${archive}" -o "$archive"
            echo "$checksum  $archive" | sha256sum -c -
            tar -xzf "$archive" -C bin
          done
          find bin -type f -name '*craft-cli' -exec chmod u+x {} \;
          find bin -type f -name '*craft-cli' -print
          command -v ffprobe
      - name: Create synthetic 2s video and audio (NOT original source)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f assets/original_12s.mp4 ]; then
            echo "754b74c4c8e0fc16c4a7b0abade25f4eda7bfadf08e28b3bb6035e69e29eabab  assets/original_12s.mp4" | sha256sum -c -
            cp assets/original_12s.mp4 native/input.mp4
            echo "END_SECONDS=12" >> "$GITHUB_ENV"
            echo "INPUT_KIND=original" >> "$GITHUB_ENV"
            echo "ORIGINAL_INPUT_VERIFIED: 12s source SHA256"
          else
            ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=320x180:rate=16:duration=2" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest native/input.mp4
            echo "END_SECONDS=2" >> "$GITHUB_ENV"
            echo "INPUT_KIND=synthetic" >> "$GITHUB_ENV"
            echo "NO_ORIGINAL_INPUT: synthetic-only test, full acceptance gate CLOSED"
          fi
          ffmpeg -v error -i native/input.mp4 -f null -
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json native/input.mp4
      - name: FilmCraft import, timeline placement and export
        shell: bash
        run: |
          set -euo pipefail
          cli="$(find bin -type f -name filmcraft-cli -print -quit)"
          "$cli" describe timeline.place > native/filmcraft-place-description.json
          cat native/filmcraft-place-description.json
          # The --demo project contains overlapping demo clips on other tracks.
          # They rendered almost black instead of our imported source (2026-10-26 log).
          # A clean headless project is required for a truthful import/export test.
          "$cli" --save-as native/filmcraft.fcproj import "$(realpath native/input.mp4)" | tee native/filmcraft-import.json
          python3 - <<'PY' > native/item-id.txt
          import json
          x=json.load(open('native/filmcraft-import.json'))
          assert x.get('errors')==[],x
          assert len(x.get('items',[]))==1,x
          print(x['items'][0])
          PY
          item="$(cat native/item-id.txt)"
          # file.newSequence(fromItem) creates a clean sequence AND places the clip
          # on V1/A1, per upstream engine commands.rs. No second placement needed.
          "$cli" --project native/filmcraft.fcproj --save exec file.newSequence "{\"fromItem\":$item,\"name\":\"Tiny Trailkeepers Native Test\",\"width\":1920,\"height\":1080,\"fps\":24}" | tee native/filmcraft-place.json
          "$cli" --project native/filmcraft.fcproj exec media.status '{}' > native/filmcraft-media-status.json 2>&1 || echo "MEDIA_STATUS_DIAGNOSTIC_FAILED (inspect artifact)"
          "$cli" --project native/filmcraft.fcproj inspect sequence > native/filmcraft-sequence.json
          python3 - <<'PY'
          import json
          x=json.load(open('native/filmcraft-sequence.json'))
          print(json.dumps(x,indent=2)[:7000])
          assert str(json.load(open('native/filmcraft-import.json'))['items'][0]) in json.dumps(x), 'Imported clip not found on exported timeline'
          PY
          timeout 240s "$cli" --project native/filmcraft.fcproj export native/filmcraft.mp4 --format h264 --start 0 --end "$END_SECONDS" > native/filmcraft-export.log 2>&1 || { cat native/filmcraft-export.log; exit 1; }
          cat native/filmcraft-export.log
          test -s native/filmcraft.mp4
          ffmpeg -v error -i native/filmcraft.mp4 -f null -
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json native/filmcraft.mp4
      - name: EffectCraft import, native effect and export
        shell: bash
        run: |
          set -euo pipefail
          cli="$(find bin -type f -name effectcraft-cli -print -quit)"
          media_path="$(realpath native/filmcraft.mp4)"
          "$cli" exec file.import "{\"paths\":[\"$media_path\"]}" --empty --save-as native/effectcraft.ecproj | tee native/effectcraft-import.json
          "$cli" exec footage.check '{"wait":true}' native/effectcraft.ecproj | tee native/effectcraft-footage-check.json
          "$cli" run native/effectcraft.ecproj project.select '{"items":[1]}' file.newCompFromSelection '{}' --save | tee native/effectcraft-comp.json
          cp native/effectcraft.ecproj native/effectcraft-unmodified.ecproj
          "$cli" exec effect.apply '{"layer":"#1","effect":"Gaussian Blur"}' native/effectcraft.ecproj --save | tee native/effectcraft-effect.json
          "$cli" exec prop.set '{"layer":"#1","path":"effects/#1/blurriness","value":20}' native/effectcraft.ecproj --save | tee native/effectcraft-effect-settings.json
          "$cli" exec effect.apply '{"layer":"#1","effect":"Invert"}' native/effectcraft.ecproj --save | tee native/effectcraft-invert.json
          timeout 240s "$cli" render native/effectcraft-unmodified.ecproj --out native/effectcraft-unmodified.mp4 --format h264 --end "$END_SECONDS" > native/effectcraft-unmodified-export.log 2>&1
          timeout 240s "$cli" render native/effectcraft.ecproj --out native/effectcraft.mp4 --format h264 --end "$END_SECONDS" > native/effectcraft-export.log 2>&1 || { cat native/effectcraft-export.log; exit 1; }
          cat native/effectcraft-export.log
          test -s native/effectcraft.mp4
          ffmpeg -v error -i native/effectcraft.mp4 -f null -
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json native/effectcraft.mp4
      - name: Strict output QA (must retain audio)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,os
          expected=float(os.environ['END_SECONDS'])
          for name in ('filmcraft','effectcraft'):
              path=f'native/{name}.mp4'
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-show_entries','stream=codec_type,width,height','-of','json',path]))
              print(name,d)
              assert abs(float(d['format']['duration'])-expected)<0.25, 'Wrong duration'
              assert any(s.get('codec_type')=='video' for s in d['streams']), 'Missing video'
              assert any(s.get('codec_type')=='audio' for s in d['streams']), 'Missing audio'
              assert any(s.get('codec_type')=='video' and s.get('width')==1920 and s.get('height')==1080 for s in d['streams']), 'Output is not 1920x1080'
          def frame(path):
              return subprocess.check_output(['ffmpeg','-nostdin','-v','error','-ss','0.5','-i',path,'-frames:v','1','-vf','scale=160:90','-pix_fmt','rgb24','-f','rawvideo','pipe:1'])
          plain=frame('native/effectcraft-unmodified.mp4')
          changed=frame('native/effectcraft.mp4')
          assert len(plain)==len(changed)==160*90*3
          for name in ('native/input.mp4','native/filmcraft.mp4','native/effectcraft-unmodified.mp4','native/effectcraft.mp4'):
              p=frame(name)
              print('frame_stats',name,'mean',sum(p)/len(p),'min',min(p),'max',max(p),'unique',len(set(p)))
          mad=sum(abs(a-b) for a,b in zip(plain,changed))/len(plain)
          print('native_effect_mean_absolute_pixel_difference',mad)
          assert mad>0.4, 'Effect did not produce a measurable visual difference'
          # A green decode with video/audio streams is insufficient: prior FilmCraft
          # output was almost black (mean RGB 3.48 vs source 123.57).
          # Reject blank/offline footage even for the synthetic test.
          src=frame('native/input.mp4')
          filmed=frame('native/filmcraft.mp4')
          src_mean=sum(src)/len(src)
          film_mean=sum(filmed)/len(filmed)
          diff=sum(abs(a-b) for a,b in zip(src,filmed))/len(src)
          print('source_vs_filmcraft_rgb_mean',src_mean,film_mean)
          print('source_vs_filmcraft_frame_mad',diff)
          assert film_mean>max(8,src_mean*0.15), 'FilmCraft footage nearly black: inspect media status, import and timeline'
          assert diff<65, 'FilmCraft source picture not preserved; investigate timeline/media decode'
          # Detect silent audio tracks (a codec stream alone is not evidence of sound).
          import struct,math
          def rms(path):
              raw=subprocess.check_output(['ffmpeg','-nostdin','-v','error','-i',path,'-vn','-ac','1','-ar','8000','-f','f32le','pipe:1'])
              n=len(raw)//4
              assert n>1000, 'Audio stream has no decoded samples'
              vals=struct.iter_unpack('<f',raw[:n*4])
              return math.sqrt(sum(v[0]*v[0] for v in vals)/n)
          source_rms=rms('native/input.mp4')
          print('source_audio_rms',source_rms)
          assert source_rms>0.0001, 'Test source has silent audio'
          for p in ('native/filmcraft.mp4','native/effectcraft.mp4'):
              out_rms=rms(p)
              print('output_audio_rms',p,out_rms)
              assert out_rms>max(0.0001,source_rms*0.02), 'Exported audio is silent'
          if os.environ['INPUT_KIND']=='original':
              print('NATIVE_ORIGINAL_12S_CHAIN_PASS_WITH_VISUAL_AND_AUDIO_QA')
          else:
              print('NATIVE_SYNTHETIC_CHAIN_PASS_WITH_VISUAL_AND_AUDIO_QA (NOT original 12s)')
          PY
          sha256sum native/input.mp4 native/filmcraft.mp4 native/effectcraft.mp4
      - name: Retain diagnostic logs (no paid services)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-chain-diagnostics
          path: |
            native/*.json
            native/*.txt
            native/*.log
            native/*.fcproj
            native/*.ecproj
            native/*.mp4
          retention-days: 1
